<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BR Architects - Contact</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Verdana, Geneva, sans-serif;
        }

        /* ---------- Header ---------- */
        #head{
            width: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: white;
        }

        /* ---------- Logo ---------- */
        .brand{
            display: flex;
            align-items: center;
            text-decoration: none;
            color: black;
        }
        .brand-mark{
            background: black;
            color: white;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 3px;
            padding: 8px 10px 8px 13px;
        }
        .brand-name{
            margin-left: 12px;
            font-size: 20px;
            letter-spacing: 1px;
        }

        /* ---------- Nav ---------- */
        #head ul{
            display: flex;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        #head li{
            margin: 0 0 0 28px;
            list-style: none;
        }
        #head a{
            text-decoration: none;
            color: black;
            font-size: 16px;
            transition: 0.3s;
        }
        #head a:hover{
            color: #FFC107;
        }

        .h2-contact{
            padding:20px;
            font-size:25px;
        }

        p{
            margin:20px;
            line-height:28px;
        }

        input{
            width: 95%;
            height: 40px;
            margin-left: 25px;
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            display: block;
        }

        .btn2{
            background-color: black;
            color: white;
            width: 150px;
            height: 60px;
            margin-top: 25px;
            margin-left: 25px;
            border: none;
            cursor: pointer;
        }

        #location_pic{
            width:100%;
            height:600px;
            margin-top:50px;
            background-image:url(images/last.jpg);
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }

        .final{
            width:100%;
            height:70px;
            background:black;
            color:white;
        }

        .footer-heading{
            text-align:center;
            line-height:70px;
            margin:0;
        }

        /* ---------- Tablet ---------- */
        @media (min-width: 601px) and (max-width: 1024px){
            #head{ padding: 10px 16px; }
            #head li{ margin: 0 0 0 18px; }
            #location_pic{ height:400px; }
        }

        /* ---------- Mobile ---------- */
        @media (max-width: 600px){
            #head{
                flex-direction: column;
                align-items: flex-start;
                padding: 12px 16px;
            }
            .brand-name{ font-size: 18px; }
            #head ul{
                margin: 10px 0 0 0;
                padding: 0;
                flex-wrap: wrap;
            }
            #head li{ margin: 8px 20px 8px 0; }
            #head a{ font-size: 15px; }

            .h2-contact{ font-size:22px; }
            p{ margin:15px; line-height:25px; }

            input{
                width:90%;
                margin-left:5%;
            }
            .btn2{
                width:150px;
                height:50px;
                margin-left:5%;
                margin-top:15px;
            }

            #location_pic{
                height:300px;
                margin-top:30px;
            }

            .final{ height:60px; }
            .footer-heading{ line-height:60px; font-size:14px; }
        }
    </style>
</head>
<body>
    <header id="head">
        <a href="index.html" class="brand">
            <span class="brand-mark">BR</span><span class="brand-name">Architects</span>
        </a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="project.html">Projects</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </header>

    <h1 class="h2-contact">Contact</h1>
    <hr>
    <p>Lets get in touch and talk about your next project.</p>

    <input type="text" placeholder="Name">
    <input type="text" placeholder="Email">
    <input type="text" placeholder="Subject">
    <input type="text" placeholder="Comment">
    <button class="btn2">Send Message</button>

    <div id="location_pic"></div>

    <div class="final">
        <p class="footer-heading">Powered by w3.css</p>
    </div>

</body>
</html>
